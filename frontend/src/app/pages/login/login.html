<div class="login-wrapper">
  <div class="login-container glass">
    <div class="login-header">
      <div class="logo"></div>
      <h2>Chào mừng trở lại</h2>
      <p>Đăng nhập vào hệ thống SmartStore</p>
    </div>
    
    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" name="username" [(ngModel)]="username" placeholder="Nhập tên đăng nhập" required>
      </div>
      <div class="form-group" style="margin-top: 1rem;">
        <label class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" name="password" [(ngModel)]="password" placeholder="Nhập mật khẩu" required>
      </div>
      
      <div *ngIf="errorMessage" class="error-banner" style="color: #ef4444; font-size: 0.85rem; margin-top: 0.75rem; text-align: center;">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem; display: flex; justify-content: center; align-items: center; gap: 0.5rem;" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Đang tải...' : 'Đăng nhập' }}
      </button>
    </form>

    <div class="demo-section" style="margin-top: 2rem; border-top: 1px dashed #e5e7eb; padding-top: 1.5rem;">
      <p style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.05em;">Đăng nhập nhanh (Demo)</p>
      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <button class="btn btn-outline" style="flex: 1; font-size: 0.85rem; padding: 0.5rem; border-color: var(--primary); color: var(--primary);" (click)="loginAsAdminDemo()" [disabled]="isLoading">
          🔑 Admin Demo
        </button>
        <button class="btn btn-outline" style="flex: 1; font-size: 0.85rem; padding: 0.5rem; border-color: #10B981; color: #10B981;" (click)="loginAsSalerDemo()" [disabled]="isLoading">
          🛒 Saler Demo
        </button>
      </div>
    </div>
  </div>
</div>
