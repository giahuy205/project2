<aside class="sidebar" [class.collapsed]="collapsed">

  <div class="logo">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="currentColor" class="logo-heart">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </div>
    <span *ngIf="!collapsed" class="logo-text">SmartStore</span>
  </div>
  
  <nav class="nav-links">
    <div class="nav-group">
      <a *ngIf="authService.isAdmin()" routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span *ngIf="!collapsed">Trang chủ</span>
      </a>
      
      <a routerLink="/sales" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span *ngIf="!collapsed">Bán hàng</span>
      </a>
      
      <a routerLink="/transactions" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span *ngIf="!collapsed">Lịch sử</span>
      </a>

      <a routerLink="/inventory" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>
        </svg>
        <span *ngIf="!collapsed">Kho hàng</span>
      </a>
      
      <a *ngIf="authService.isAdmin()" routerLink="/imports" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="21 16 12 21 3 16"></polyline>
          <polyline points="21 7 12 12 3 7"></polyline>
          <line x1="12" y1="22" x2="12" y2="12"></line>
          <polyline points="12 2 22 7 12 12 2 7 12 2"></polyline>
        </svg>
        <span *ngIf="!collapsed">Nhập kho</span>
      </a>
      
      <a *ngIf="authService.isAdmin()" routerLink="/reports" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span *ngIf="!collapsed">Thống kê</span>
      </a>
      
      <a *ngIf="authService.isAdmin()" routerLink="/staff" routerLinkActive="active" class="nav-item">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span *ngIf="!collapsed">Nhân viên</span>
      </a>
    </div>

    <!-- Bottom user profile and log out section -->
    <div class="sidebar-footer">
      <!-- Profile Card -->
      <div *ngIf="!collapsed" class="profile-card" routerLink="/settings" routerLinkActive="active" style="cursor: pointer; transition: opacity 0.2s;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
        <div class="profile-avatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center;">
          <img *ngIf="authService.getAvatar()" [src]="authService.getAvatar()" style="width: 100%; height: 100%; object-fit: cover;">
          <svg *ngIf="!authService.getAvatar()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <div class="profile-info">
          <span class="profile-name">{{ authService.getFullName() || 'Guest' }}</span>
          <span class="profile-role">
            {{ authService.getRole() === 'admin' ? 'Quản trị viên' : 'Thu ngân' }}
          </span>
        </div>
      </div>
      
      <!-- Collapsed Avatar -->
      <div *ngIf="collapsed" class="profile-avatar-collapsed" routerLink="/settings" routerLinkActive="active" style="cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center;">
        <img *ngIf="authService.getAvatar()" [src]="authService.getAvatar()" style="width: 100%; height: 100%; object-fit: cover;">
        <svg *ngIf="!authService.getAvatar()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <!-- Toggle Collapse Button -->
      <button class="toggle-btn" (click)="toggleCollapse()" title="Thu gọn/Mở rộng">
        <svg *ngIf="!collapsed" class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <svg *ngIf="collapsed" class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
        <span *ngIf="!collapsed">Thu gọn</span>
      </button>
    </div>
  </nav>
</aside>
