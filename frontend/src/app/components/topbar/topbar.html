<header class="topbar">
  <div class="clock-container" style="font-size: 1rem; font-weight: 500; color: #94a3b8;">
    {{ currentTime | date:'HH:mm - dd/MM/yyyy' }}
  </div>

  <div class="actions">
    <div class="notification-wrapper" style="position: relative;">
      <button class="notification-btn" (click)="toggleNotifications($event)">
        <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <!-- Notification Dropdown -->
      <div class="notification-dropdown" *ngIf="showNotifications" (click)="$event.stopPropagation()">
        <div class="dropdown-header">
          <h4>Thông báo</h4>
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <button (click)="markAllAsRead($event)" *ngIf="unreadCount > 0" 
              style="border: none; background: transparent; color: var(--primary, #4f46e5); font-size: 0.75rem; cursor: pointer; font-weight: 600; padding: 2px 4px; text-decoration: underline;">
              Đọc tất cả
            </button>
            <span class="badge" [style.background-color]="unreadCount > 0 ? '#ef4444' : '#94a3b8'">{{ unreadCount }} mới</span>
          </div>
        </div>
        <div class="dropdown-body">
          <div class="notification-item" *ngFor="let notif of notifications" 
            [class.read]="notif.read"
            (click)="onNotificationClick(notif)"
            style="cursor: pointer; position: relative;">
            <div class="notif-icon" [ngClass]="notif.type">
              <span *ngIf="notif.type === 'out_of_stock'">⚠️</span>
              <span *ngIf="notif.type === 'low_stock'">📉</span>
              <span *ngIf="notif.type === 'expired'">❌</span>
              <span *ngIf="notif.type === 'near_expiry'">⏳</span>
            </div>
            <div class="notif-content" style="padding-right: 1.5rem;">
              <p>{{ notif.message }}</p>
              <small>{{ notif.time | date:'HH:mm dd/MM' }}</small>
            </div>
            <button (click)="dismissNotification($event, notif)" 
              style="position: absolute; right: 12px; top: 12px; border: none; background: transparent; font-size: 1.2rem; line-height: 1; cursor: pointer; color: var(--text-muted, #94a3b8); z-index: 10; padding: 0 4px;"
              title="Xóa thông báo">
              &times;
            </button>
          </div>
          <div class="notification-item empty" *ngIf="notifications.length === 0">
            <p>Không có thông báo mới.</p>
          </div>
        </div>
      </div>
    </div>
    
    <div class="topbar-profile" style="position: relative;">
      <div class="topbar-avatar" (click)="toggleProfileMenu($event)" style="cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); transition: all 0.2s;">
        <img *ngIf="authService.getAvatar()" [src]="authService.getAvatar()" style="width: 100%; height: 100%; object-fit: cover;">
        <svg *ngIf="!authService.getAvatar()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </div>

      <!-- Profile Dropdown Menu -->
      <div class="profile-dropdown" *ngIf="showProfileMenu" (click)="$event.stopPropagation()">
        <div class="dropdown-item" (click)="goToProfile()">
          <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Xem thông tin cá nhân</span>
        </div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item logout" (click)="logout()">
          <svg class="dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Đăng xuất</span>
        </div>
      </div>
    </div>
  </div>
</header>
